apiVersion: apps/v1
kind: Deployment
metadata:
  name: documentvault-deployment
  labels:
    app: documentvault
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: documentvault
      tier: frontend
  template:
    metadata:
      labels:
        app: documentvault
        tier: frontend
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: documentvault-app
          image: documentvault-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: documentvault-config
            - secretRef:
                name: documentvault-secrets
          volumeMounts:
            - name: pdf-storage
              mountPath: /app/uploads
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: pdf-storage
          persistentVolumeClaim:
            claimName: app-pdf-pvc
