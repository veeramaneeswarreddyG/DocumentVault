{% extends "base.html" %}

{% block title %}400 Bad Request — Document Vault{% endblock %}

{% block content %}
<div class="error-page-wrapper">
    <div class="error-card glass-panel">
        <div class="error-badge">ERROR 400</div>
        <h1 class="error-title">Bad Request</h1>
        <p class="error-description">
            {{ error or "The server could not understand or validate your request parameters." }}
        </p>
        <div class="error-actions">
            <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-glow">Return to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
